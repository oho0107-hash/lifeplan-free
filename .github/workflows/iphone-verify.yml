name: Lifeplan free browser test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free browser test tools
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Open app, fill data, calculate and compare
        run: |
          python - <<'PY'
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from threading import Thread
          from playwright.sync_api import sync_playwright

          class QuietHandler(SimpleHTTPRequestHandler):
              def log_message(self, *args):
                  pass

          server = ThreadingHTTPServer(('127.0.0.1', 0), QuietHandler)
          thread = Thread(target=server.serve_forever, daemon=True)
          thread.start()
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page(viewport={'width':390, 'height':844})
                  page.goto(f'http://127.0.0.1:{server.server_port}/index.html')
                  assert page.locator('#calculate').is_enabled()
                  fake_data = {
                      'husband_birth': '1990-01-01',
                      'wife_birth': '1991-06-01',
                      'kid1_birth': '2020-01-01',
                      'kid2_birth': '2022-01-01',
                      'kid3_birth': '2024-01-01',
                      'husband_month_net': '450000',
                      'wife_month_net': '250000',
                      'current_savings': '12000000',
                      'living_cost_annual': '5600000'
                  }
                  for key, value in fake_data.items():
                      page.locator('#' + key).fill(value)
                  page.locator('#calculate').click()
                  assert page.locator('#results').is_visible(), '計算結果が表示されない'
                  assert page.locator('#kpis .kpi').count() == 4, '主要4指標が出ない'
                  assert page.locator('#tableBody tr').count() > 20, '年次表が不足'
                  assert page.evaluate('document.documentElement.scrollWidth <= innerWidth'), 'iPhoneで横はみ出し'
                  print('PASS 1: iPhoneサイズで入力・結果・表・グラフ')

                  page.locator('#edit').click()
                  page.locator('#kid4_has').select_option('yes')
                  page.locator('#kid4_birth').fill('2028-01-01')
                  page.locator('#calculate').click()
                  assert page.locator('#eduBreakdown').get_by_text('四男').count() > 0, '四男の教育費がない'
                  page.reload()
                  assert page.locator('#kid4_birth').input_value() == '2028-01-01', 'データ保存ができない'
                  print('PASS 2: 4人目の教育費と入力内容の保存')

                  page.locator('#calculate').click()
                  page.locator('#edit').click()
                  for key in ['husband_month_net', 'wife_month_net', 'husband_bonus_net', 'wife_bonus_net', 'current_savings', 'current_invest_balance']:
                      page.locator('#' + key).fill('0')
                  page.locator('#calculate').click()
                  assert page.locator('#debtAlert').is_visible(), '資金不足が表示されない'
                  result = page.evaluate('LifeEngine.settleAssets(100, 0, -250, 0, 0)')
                  assert result['debt'] == 150 and result['total'] == -150, '不足分の計算が違う'
                  print('PASS 3: 資金不足・負の残高と独立した期待値')
                  browser.close()
          finally:
              server.shutdown()
              server.server_close()
          PY
