name: Check official education prices
'on':
  schedule:
    - cron: '15 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-official-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text parser (free)
        run: python -m pip install 'pypdf>=5,<7'
      - name: Recheck registered official school and provider pages
        run: python automation/cost_freshness.py
      - name: Upload dated source status report
        uses: actions/upload-artifact@v4
        with:
          name: official-school-prices-status
          path: reports/official_cost_source_check.json
          retention-days: 30
