name: LIFE independent PR quality
'on':
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pr-quality-gate:
    name: pr-quality-gate
    uses: ./.github/workflows/quality-checks.yml
    with:
      evidence_name: pr-quality-evidence
    permissions:
      contents: read
  publish-commit-status:
    needs: [pr-quality-gate]
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      statuses: write
    steps:
      # No checkout and no execution of PR code in the write-authorized job.
      - name: Record verdict on the exact tested SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.pr-quality-gate.result }}
        run: |
          set -euo pipefail
          verdict=failure
          if [ "$TEST_RESULT" = success ]; then verdict=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$verdict" -f context='lifeplan/independent-quality' \
            -f description='Isolated regression and mobile browser check verdict' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
