name: LIFE publish Pages from tested main
'on':
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Package only approved public pages and official source links
        run: |
          set -euo pipefail
          mkdir -p public/costs
          cp index.html education-reserve.html public/
          cp costs/official_sources.json public/costs/official_sources.json
          # Do not publish API keys, Python automation, private family data,
          # internal reviews, or unverified experimental research artifacts.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
