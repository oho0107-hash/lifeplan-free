name: Lifeplan independent financial diagnostic
'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose independently; unresolved serious discrepancies fail this check
        run: python automation/test_independent_finance.py --diagnose --output reports/finance-diagnostics.json --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifeplan-policy-audit
          path: reports/finance-diagnostics.json
          if-no-files-found: error
